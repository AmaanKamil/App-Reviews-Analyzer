name: Keep Streamlit app awake

# Streamlit Community Cloud hibernates apps after ~12h without visitors.
# A plain curl doesn't count as a visit, so open the app in a real browser
# and press the "wake up" button if it has already gone to sleep.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Playwright
      run: |
        pip install playwright
        python -m playwright install --with-deps chromium
    - name: Visit app
      env:
        DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      run: python .github/scripts/keep_alive.py
